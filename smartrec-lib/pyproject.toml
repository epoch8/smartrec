[project]
name = "epoch8-smartrec-lib"
version = "0.1.0-dev.3"
description = "smartrec main lib"
readme = "README.md"
authors = [{ name = "Shakirov Renat", email = "renat@epoch8.co" }]


requires-python = ">=3.11,<3.13"
dependencies = [
    "dill>=0.3.8",
    "fsspec>=2023.4.0",
    "pathy>=0.11.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.2",
    "rectools>=0.10.0,<=0.12.0",
    "rectools-lightfm>=1.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["smartrec_lib"]

[dependency-groups]
dev = [
    "black>=24.10.0",
    "pytest>=8.3.4",
]

[tool.black]
line-length = 120
target-version = ['py36', 'py37', 'py38', 'py39', 'py310']

[tool.isort]
profile = "black"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
