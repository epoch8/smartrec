[project]
name = "epoch8-smartrec-lib"
version = "0.1.1-dev.7"
description = "smartrec main lib"
readme = "README.md"
authors = [{ name = "Shakirov Renat", email = "renat@epoch8.co" }]


requires-python = ">=3.10, <4"
dependencies = [
    "dill>=0.3.8",
    "fsspec>=2025.1.0",
    'numpy>=1.26.0,<2.0.0; python_version < "3.13"',
    'numpy>=2.1.0; python_version >= "3.13"',
    "pathy>=0.11.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.2",
    # Pre-built implicit to avoid long compilation during Docker builds
    "implicit>=0.5.5; python_version < '3.13'",
    "rectools>=0.17.0,<=0.20.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.0.0",
    "bottleneck>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["smartrec_lib"]

[dependency-groups]
dev = [
    "black>=24.10.0",
    "pytest>=8.3.4",
    "pandas>=2.0.0",
]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.isort]
profile = "black"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
