[project]
name = "epoch8-smartrec-client"
version = "0.1.1-dev.4"
description = ""
authors = [{ name = "Shakirov Renat", email = "renat@epoch8.co" }]
readme = "README.md"

requires-python = ">=3.10, <3.14"

dependencies = [
    "tritonclient[grpc]>=2.43.0",
    'numpy>=1.26.0,<2.0.0; python_version < "3.13"',
    'numpy>=2.1.0; python_version >= "3.13"',
]

[tool.hatch.build.targets.wheel]
packages = ["smartrec_client"]

[tool.uv]
dev-dependencies = ["pytest"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312', 'py313']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
