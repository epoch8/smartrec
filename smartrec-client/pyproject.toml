[project]
name = "epoch8-smartrec-client"
version = "0.1.0-dev.2"
description = ""
authors = [{ name = "Shakirov Renat", email = "renat@epoch8.co" }]
readme = "README.md"

requires-python = ">=3.10, <4"

dependencies = ["tritonclient[http, grpc]>=2.43.0,<=2.70.0"]

[tool.hatch.build.targets.wheel]
packages = ["smartrec_client"]

[tool.uv]
dev-dependencies = ["pytest"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312', 'py313']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
