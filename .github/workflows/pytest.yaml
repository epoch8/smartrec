name: Python package

on: [push]

jobs:
  client_build_and_test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Get files from Git LFS
      run: |
        git lfs fetch
        git lfs pull
    - name: Install deps
      run: |
        sudo apt-get install build-essential libssl-dev libffi-dev python3-dev
    - name: Install poetry
      run: pip install poetry==1.8.3
    - name: Install deps for poetry install
      working-directory: ./smartrec-client
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install --upgrade pip
    - name: Install libs
      working-directory: ./smartrec-client
      run: |
        poetry install --all-extras
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --ignore F821
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        poetry run flake8 . --ignore=C901,F821 --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  lib_build_and_test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Get files from Git LFS
      run: |
        git lfs fetch
        git lfs pull
    - name: Install deps
      run: |
        sudo apt-get install build-essential libssl-dev libffi-dev python3-dev
    - name: Install poetry
      run: pip install poetry==1.8.3
    - name: Install deps for poetry install
      working-directory: ./smartrec-lib
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install --upgrade pip
    - name: Install libs
      working-directory: ./smartrec-lib
      run: |
        poetry install --all-extras
    - name: Lint with flake8
      working-directory: ./smartrec-lib
      run: |
        # stop the build if there are Python syntax errors or undefined names
        poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --ignore F821
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        poetry run flake8 . --ignore=C901,F821 --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      working-directory: ./smartrec-lib
      run: |
        poetry run pytest