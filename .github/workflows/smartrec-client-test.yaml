name: smartrec-client test

on: 
  push:
    paths:
      - ".github/workflows/smartrec-client-test.yaml"
      - "smartrec-client/**"

jobs:
  build_and_test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Get files from Git LFS
      run: |
        git lfs fetch
        git lfs pull
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v5
    - name: Install libs
      run: |
        uv sync
    - name: Lint with flake8
      working-directory: ./smartrec-client
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --ignore F821
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run flake8 . --ignore=C901,F821 --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
